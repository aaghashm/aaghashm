name: daily

on:
  schedule:
    # 01:17 PDT / 00:17 PST: always after midnight PT, and off the hour so it isn't delayed
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: track-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - id: r
        run: node scripts/reconcile.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TRIGGER: schedule
      - if: steps.r.outputs.more == 'true'
        run: gh workflow run play.yml -R "$REPO"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
      # the daily commit keeps it on too, this is a free second guard
      - run: gh workflow enable daily.yml -R "$REPO"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
